<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="288" viewBox="0 0 1040 288" role="img" aria-label="legacy2mcp — legacy SOAP/WSDL, database, REST API, or website turned into safe, typed MCP tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#6f9bf7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1038" height="286" rx="20" fill="url(#bg)" stroke="#2a3350" stroke-width="1.5"/>

  <g fill="#ffffff" opacity="0.045">
    <circle cx="946" cy="170" r="2"/><circle cx="975" cy="170" r="2"/><circle cx="1004" cy="170" r="2"/>
    <circle cx="946" cy="199" r="2"/><circle cx="975" cy="199" r="2"/><circle cx="1004" cy="199" r="2"/>
    <circle cx="946" cy="228" r="2"/><circle cx="975" cy="228" r="2"/><circle cx="1004" cy="228" r="2"/>
  </g>

  <!-- glyph: SOAP / DB / REST / WEB  ->  MCP hex -->
  <g transform="translate(40,40)" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <rect x="0" y="4" width="58" height="38" rx="9" fill="none" stroke="#4b5675" stroke-width="2.5"/>
    <text x="29" y="28" text-anchor="middle" fill="#8b93a7" font-size="12.5" font-weight="700" letter-spacing="0.5">SOAP</text>

    <rect x="0" y="61" width="58" height="38" rx="9" fill="none" stroke="#4b5675" stroke-width="2.5"/>
    <text x="29" y="85" text-anchor="middle" fill="#8b93a7" font-size="12.5" font-weight="700" letter-spacing="0.5">DB</text>

    <rect x="0" y="118" width="58" height="38" rx="9" fill="none" stroke="#4b5675" stroke-width="2.5"/>
    <text x="29" y="142" text-anchor="middle" fill="#8b93a7" font-size="12.5" font-weight="700" letter-spacing="0.5">REST</text>

    <rect x="0" y="175" width="58" height="38" rx="9" fill="none" stroke="#4b5675" stroke-width="2.5"/>
    <text x="29" y="199" text-anchor="middle" fill="#8b93a7" font-size="12.5" font-weight="700" letter-spacing="0.5">WEB</text>

    <path d="M58 23 Q100 23 128 108" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M58 80 Q100 80 128 108" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M58 137 Q100 137 128 108" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M58 194 Q100 194 128 108" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M128 98 L142 108 L128 118" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#glow)">
      <path d="M186 73 l30 17 v36 l-30 17 -30 -17 v-36 z" fill="none" stroke="url(#accent)" stroke-width="3.5"/>
    </g>
    <text x="186" y="113" text-anchor="middle" fill="#c9b8f5" font-size="13" font-weight="700" letter-spacing="1">MCP</text>
  </g>

  <!-- wordmark -->
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <text x="300" y="129" fill="#eef1f8" font-size="52" font-weight="800" letter-spacing="-1">legacy<tspan fill="#a371f7">2</tspan>mcp</text>
    <text x="302" y="164" fill="#9aa4bd" font-size="18.5" font-weight="500">WSDL, database, REST API, or website &#8594; safe, typed MCP tools</text>
    <text x="302" y="196" fill="#5b657f" font-size="12.5" font-weight="600" letter-spacing="0.4">SCHEMA-VALIDATED &#183; READ-ONLY BY DEFAULT &#183; AUDIT-LOGGED</text>
  </g>
</svg>
