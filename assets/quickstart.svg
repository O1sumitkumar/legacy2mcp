<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="260" viewBox="0 0 1040 260" role="img" aria-label="Three-step quick start: pip install legacy2mcp, legacy2mcp init --rest-url against the public Swagger Petstore, then legacy2mcp inspect to see the generated MCP tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#6f9bf7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1038" height="258" rx="20" fill="url(#bg)" stroke="#2a3350" stroke-width="1.5"/>

  <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f"/>
  <text x="1012" y="33" text-anchor="end" fill="#5b657f" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">QUICK START</text>
  <path d="M20 52 H1020" stroke="#1c2540" stroke-width="1.5"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" xml:space="preserve">
    <text x="40" y="100" xml:space="preserve"><tspan fill="url(#accent)" font-weight="700">$&#160;</tspan><tspan fill="#eef1f8">pip install legacy2mcp</tspan></text>

    <text x="40" y="150" xml:space="preserve"><tspan fill="url(#accent)" font-weight="700">$&#160;</tspan><tspan fill="#eef1f8">legacy2mcp init --rest-url "https://petstore3.swagger.io/api/v3" --out config.yaml</tspan></text>

    <text x="40" y="200" xml:space="preserve"><tspan fill="url(#accent)" font-weight="700">$&#160;</tspan><tspan fill="#eef1f8">legacy2mcp inspect --config config.yaml</tspan><tspan fill="#5b657f">&#160;&#160;&#160;# see the generated MCP tools</tspan></text>
  </g>

  <text x="40" y="238" fill="#5b657f" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500">No API key, no cloning -- works against the public Swagger Petstore out of the box.</text>
</svg>
