<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-label="Quick start: pip install legacy2mcp, then legacy2mcp init --rest-url against the public Swagger Petstore, which writes config.yaml and opens a local test-chat page -- click an example question and get a real response from the live API, no AI key needed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#6f9bf7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1038" height="468" rx="20" fill="url(#bg)" stroke="#2a3350" stroke-width="1.5"/>

  <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f"/>
  <text x="1012" y="33" text-anchor="end" fill="#5b657f" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">QUICK START</text>
  <path d="M20 52 H1020" stroke="#1c2540" stroke-width="1.5"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">
    <text x="40" y="86" font-size="17" xml:space="preserve"><tspan fill="url(#accent)" font-weight="700">$&#160;</tspan><tspan fill="#eef1f8">pip install legacy2mcp</tspan></text>

    <text x="40" y="122" font-size="17" xml:space="preserve"><tspan fill="url(#accent)" font-weight="700">$&#160;</tspan><tspan fill="#eef1f8">legacy2mcp init --rest-url "https://petstore3.swagger.io/api/v3"</tspan></text>
    <text x="58" y="144" font-size="13" fill="#6fe39a" xml:space="preserve">Wrote config.yaml (rest adapter, 19 tool source(s) detected).</text>
    <text x="58" y="164" font-size="13" fill="#8fd6ff" xml:space="preserve">Opening a test chat at http://127.0.0.1:52341 (no AI key needed -- Ctrl+C to stop).</text>
  </g>

  <path d="M20 184 H1020" stroke="#1c2540" stroke-width="1.5"/>

  <!-- mini browser window: the test chat page that just opened -->
  <rect x="40" y="198" width="960" height="212" rx="10" fill="#0f1830" stroke="#28325a" stroke-width="1.25"/>
  <circle cx="56" cy="214" r="3.5" fill="#ff5f56"/>
  <circle cx="68" cy="214" r="3.5" fill="#ffbd2e"/>
  <circle cx="80" cy="214" r="3.5" fill="#27c93f"/>
  <rect x="100" y="206" width="880" height="18" rx="5" fill="#162040"/>
  <text x="110" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8b94ad">127.0.0.1:52341</text>
  <path d="M40 232 H1000" stroke="#1c2540" stroke-width="1"/>

  <rect x="60" y="246" width="236" height="28" rx="6" fill="none" stroke="#3a4878" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="72" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6fe39a">Try: "get pet by id 4"</text>
  <text x="308" y="264" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b657f">&#8592; click an example, generated from the real tool list</text>

  <rect x="702" y="290" width="278" height="28" rx="10" fill="url(#accent)"/>
  <text x="720" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#0b1220">get pet by id 4</text>

  <rect x="60" y="330" width="660" height="62" rx="10" fill="#13203f" stroke="#28325a" stroke-width="1.25"/>
  <text x="74" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6fe39a">legacy_getPetById</text>
  <text x="74" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c7cedd" xml:space="preserve">{"id": 4, "name": "Dog 1", "category": {"name": "Dogs"},</text>
  <text x="74" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c7cedd" xml:space="preserve">&#160;"status": "available"}</text>

  <text x="40" y="432" fill="#5b657f" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500">A genuine response from the live Petstore API -- not mocked. Point a real MCP client at config.yaml next (see below) for AI-driven use.</text>
</svg>
